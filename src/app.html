<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const root = document.documentElement;
				const fonts = {
					pop: "Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600",
					cream: "Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=DM+Sans:wght@400;500;600",
					evening: "Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600",
					sage: "Young+Serif&family=Work+Sans:wght@400;500;600",
					lilac: "Fraunces:wght@400;500;600&family=Figtree:wght@400;500;600",
					butter: "Fredoka:wght@400;500;600&family=Nunito:wght@400;500;600",
				};
				const link = document.createElement("link");
				link.rel = "stylesheet";
				link.id = "theme-fonts";
				function apply(value) {
					const theme = Object.hasOwn(fonts, value) ? value : "cream";
					root.dataset.theme = theme;
					link.href = `https://fonts.googleapis.com/css2?family=${fonts[theme]}&display=swap`;
				}
				let saved = "cream";
				try {
					saved = localStorage.getItem("meadow-theme") || "cream";
				} catch {}
				apply(saved);
				document.head.append(link);
				root.dataset.material = "glass";
				new MutationObserver(() => {
					const theme = root.dataset.theme;
					if (Object.hasOwn(fonts, theme))
						link.href = `https://fonts.googleapis.com/css2?family=${fonts[theme]}&display=swap`;
				}).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
				window.addEventListener("storage", (event) => {
					if (event.key === "meadow-theme") apply(event.newValue);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
