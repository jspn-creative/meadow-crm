name: Refresh preview data

on:
  schedule:
    # First day of each month, 09:00 UTC.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    concurrency:
      group: meadow-preview-snapshot
      cancel-in-progress: false
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.0.0'
          node-version: '24'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec -- alchemy provider check-env --provider Cloudflare
      - name: Refresh snapshot once per month
        run: vp run preview:data -- monthly
      - name: List same-repository open PRs
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false) | .number] | @json')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  refresh:
    needs: snapshot
    if: needs.snapshot.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.snapshot.outputs.prs) }}
    uses: ./.github/workflows/ci.yml
    with:
      preview_pr: ${{ matrix.pr }}
    secrets: inherit
